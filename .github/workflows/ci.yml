# CI mirrors the Taskfile's check surface (task lock:check / test) plus the nix
# acceptance paths: registry eval, a keyless run, entrypoint-identity, and the
# authoring loop (adb-dev init → build → run). Keyless throughout — mockllm/mock
# only, no provider credentials, no docker experiments.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # uv.lock freshness + python unit tests — no nix involved
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: uv lock freshness (task lock:check)
        run: |
          for dir in $(git ls-files '*uv.lock' | xargs -n1 dirname); do
            echo "uv lock --check: $dir"
            (cd "$dir" && uv lock --check) || exit 1
          done

      - name: runner tests
        working-directory: runner
        run: uv run -q pytest -q
      - name: adb-inspect tests
        working-directory: lib/adb-inspect
        run: uv run -q pytest -q
      - name: concordia tests
        working-directory: experiments/concordia
        run: uv run -q pytest -q

  # web unit tests + render guard + production build (the manifest oneliner
  # sweep self-skips without ADB_WEB_MANIFESTS; the nix job's manifests build
  # covers that surface at eval level)
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: bash web/build.sh

  # the nix acceptance path: everything an experiment consumer or author touches
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # nix-shell -p (the nix-run leg of the entrypoint check) resolves <nixpkgs>
      # from here; the installer action doesn't set one
      NIX_PATH: nixpkgs=channel:nixos-26.05
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the authoring smoke fetches a rev from file://$PWD
      # the NixOS-org installer action; still self-labeled experimental with no
      # stable tags (hence @main) — chosen deliberately over the third-party ones
      - uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            keep-outputs = true
            keep-env-derivations = true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/uv.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - name: registry eval — build every experiment's manifest
        run: nix-build --no-out-link -A manifests

      - name: keyless run — inspect-hello on the mock model
        run: |
          ADB_HOME="$RUNNER_TEMP/adb-home" \
            "$(nix-build --no-out-link -A exec.inspect-hello)" \
            --set model=mockllm/model --set limit=0 --set epochs=1 --set 'generate_args={}'

      - name: entrypoint identity — nix run / nix-build / nix-run mint the same condition
        run: ./scripts/check-entrypoint-identity.sh

      - name: authoring smoke — adb-dev init, build through --arg experiments, run
        run: |
          scaffold="$RUNNER_TEMP/ci-chat"
          "$(nix-build --no-out-link -A exec.adb-dev)" init ci-chat \
            --dir "$scaffold" --adb-url "file://$PWD" --rev "$GITHUB_SHA"
          ADB_HOME="$RUNNER_TEMP/adb-home" \
            "$(nix-build --no-out-link -A exec.ci-chat --arg experiments "$scaffold")" \
            --set 'prompt=Say one surprising thing.' --set turns=2 \
            --set model=mock/model --set temperature=0.7
