# The canonical provider registry — ADB's vocabulary of provider names and their
# credential templates, hand-curated. This file is the ONE place these facts live.
#
# A provider's name is the canonical model-id prefix: the provider's ORG name
# (`google`, not the Gemini model family; `moonshotai`, matching their org).
#
# A credential template is two role-typed vars:
#   api_key   the secret — hidden at the setup prompt, masked in listings.
#             `required` (default true): a value must exist at runtime; consumers
#             fail early and actionably when it doesn't. The one annotation in the
#             file is openai's: local OpenAI-compatible servers (llama.cpp, vLLM,
#             ollama) ignore auth, so that key alone is not required — the chat
#             client sends a placeholder bearer when it is absent.
#   base_url  the endpoint — always the PLAIN API origin the provider's own
#             ecosystem expects for the var. `default` (default "") is offered at
#             the setup prompt (Enter adopts it) and used as the runtime fallback;
#             no default means setup and runtime both require an explicit value.
#
# Everything else about a provider is a LAYER owned by its consumer, referencing
# these facts by name and never restating them: foreign catalog spellings live in
# lib/model-catalog/update.py; the chat client's compat-mount exceptions live in
# adb_experiment.providers; framework tenants (inspect, litellm, ...) keep their
# remaps in their own adapter libraries (adb-inspect), exceptions-only. This file
# never mentions a tenant or a foreign catalog.

mock_prefixes = ["mock", "mockllm"]

[providers.openai]
api_key = { name = "OPENAI_API_KEY", required = false }
base_url = { name = "OPENAI_BASE_URL", default = "https://api.openai.com/v1" }

[providers.anthropic]
api_key = { name = "ANTHROPIC_API_KEY" }
base_url = { name = "ANTHROPIC_BASE_URL", default = "https://api.anthropic.com" }

[providers.google]
api_key = { name = "GOOGLE_API_KEY" }
base_url = { name = "GOOGLE_BASE_URL", default = "https://generativelanguage.googleapis.com/v1beta/openai" }

[providers.groq]
api_key = { name = "GROQ_API_KEY" }
base_url = { name = "GROQ_BASE_URL", default = "https://api.groq.com/openai/v1" }

[providers.mistral]
api_key = { name = "MISTRAL_API_KEY" }
base_url = { name = "MISTRAL_BASE_URL", default = "https://api.mistral.ai/v1" }

[providers.grok]
api_key = { name = "GROK_API_KEY" }
base_url = { name = "GROK_BASE_URL", default = "https://api.x.ai/v1" }

[providers.moonshotai]
api_key = { name = "MOONSHOTAI_API_KEY" }
base_url = { name = "MOONSHOTAI_BASE_URL", default = "https://api.moonshot.ai/v1" }

[providers.openrouter]
api_key = { name = "OPENROUTER_API_KEY" }
base_url = { name = "OPENROUTER_BASE_URL", default = "https://openrouter.ai/api/v1" }

[providers.azureai]
# No universal origin — the base URL is per-resource (the v1 surface,
# https://<resource>.openai.azure.com/openai/v1; model = your deployment name),
# so it has no default: setup and runtime both require an explicit value.
api_key = { name = "AZUREAI_API_KEY" }
base_url = { name = "AZUREAI_BASE_URL" }
