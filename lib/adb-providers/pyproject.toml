[project]
name = "adb-providers"
version = "0.1.0"
description = "The canonical provider registry — ADB's vocabulary of provider names and their credential templates"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adb_providers"]

# Non-editable path-dep consumers rebuild only when the cache key changes, and uv's
# default key is pyproject.toml alone — key on the sources so edits propagate.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "adb_providers/**/*.py" }]
