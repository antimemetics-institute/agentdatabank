[project]
name = "adb-events"
version = "0.1.0"
description = "The standardized ADB event shapes — shared by the runner and Python control planes"
requires-python = ">=3.13"
dependencies = [
    "msgspec>=0.18",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adb_events"]

# Consumers take this package as a non-editable path dep, and uv's default cache
# key is pyproject.toml alone — a source-only edit here would leave every
# consumer's venv running (and typechecking) a stale copy until the next relock.
# Keying the built wheel on the sources makes `uv sync`/`uv run` pick edits up.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "adb_events/**/*.py" }]
