[project]
name = "adb-events"
version = "0.1.0"
description = "The standardized ADB event shapes — shared by the runner and Python control planes"
requires-python = ">=3.13"
dependencies = [
    "msgspec>=0.18",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adb_events"]
