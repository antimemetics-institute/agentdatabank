# Everything a Python ADB experiment needs beyond the event vocabulary: the
# runner-protocol scaffold (scaffold.py), provider->endpoint routing (providers.py),
# and the instrumented OpenAI-compat LLM client (llm.py, behind the [llm] extra so
# the base install stays SDK-free). Split from adb-events so the vocabulary package
# the runner depends on stays exactly that — the vocabulary.
[project]
name = "adb-experiment"
version = "0.1.0"
description = "The Python experiment-side toolkit for ADB — protocol scaffold, provider routing, instrumented LLM client"
requires-python = ">=3.13"
dependencies = [
    "adb-events",
    # the canonical provider registry: names, credential templates, chat routing
    "adb-providers",
]

# adb_experiment.llm needs the OpenAI SDK; experiments that call models depend on
# `adb-experiment[llm]`, ones that only need the scaffold skip it
[project.optional-dependencies]
llm = ["openai>=1.60"]

[dependency-groups]
dev = [
    "pytest>=8",
    # mirrors the [llm] extra so `task typecheck` sees the SDK's real types;
    # consumers still opt in via adb-experiment[llm]
    "openai>=1.60",
]

# adb-events is in-repo (not on PyPI); the nix build (adb.mkPythonEnv) also
# overrides it to the same source.
[tool.uv.sources]
adb-events = { path = "../adb-events" }
adb-providers = { path = "../adb-providers" }

# Non-editable path-dep consumers rebuild only when the cache key changes, and uv's
# default key is pyproject.toml alone — key on the sources so edits propagate.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "adb_experiment/**/*.py" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adb_experiment"]
