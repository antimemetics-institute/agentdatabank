# The importable package is `concordia_sim` — a top-level package named `concordia`
# would shadow the upstream `concordia` library we import, so the dir name and the
# experiment names (concordia-<scenario>) intentionally differ (same trick inspect
# uses for the stdlib).
[project]
name = "adb-concordia"
version = "0.1.0"
description = "Concordia (google-deepmind) generative agent simulations as ADB experiments — one experiment per scenario, ADB events out"
requires-python = ">=3.13"
dependencies = [
    # bounded so a relock is a deliberate line-edit, not silent drift of the wrapped
    # tool; the exact resolved version is in uv.lock and recorded per run as a
    # provenance covariate
    "gdm-concordia~=2.4.0",
    # transport for real backends: concordia.contrib's BaseGPTModel drives an
    # OpenAI-SDK client (we hand it an instrumented one; see concordia_sim/client.py)
    "openai>=1.60",
    # the shared ADB event shapes — typed, validated emission (no hand-built dicts)
    "adb-events",
    # the experiment-side toolkit: protocol scaffold + provider routing; [llm] = the
    # instrumented OpenAI-compat ChatClient (llm.call emission, mock/ backend)
    "adb-experiment[llm]",
    "pydantic>=2",
    "pyyaml>=6",
    # the deterministic hash embedder (Concordia's memory bank wants numpy vectors);
    # Concordia pulls numpy anyway, pinned here so the import is explicit
    "numpy>=1.26",
]

# adb-events / adb-experiment are in-repo (not on PyPI); the nix build
# (adb.mkPythonEnv) also overrides them to the same sources.
[tool.uv.sources]
adb-events = { path = "../../lib/adb-events" }
adb-experiment = { path = "../../lib/adb-experiment" }

# the console script can't be `concordia` (it would collide with the upstream package's
# own entry namespace and reads ambiguously); the binary is `concordia-sim`.
[project.scripts]
concordia-sim = "concordia_sim.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["concordia_sim"]
