# The inspect_evals family's pinned env: the shared inspect wrapper, the upstream
# inspect_evals task catalog, and the bundled keyless hello task. The experiments are
# generated by package.nix from task_catalog.json (`task tasks:update` regenerates it
# from this pin's registry); this project only pins the software. Bump the bound
# deliberately, then regen: the pin is part of every experiment's identity, so the
# family re-versions together — identity records strictly and never judges; read-time
# pooling bridges harmless boundaries, and the regen prints upstream's per-eval
# comparability-version diff as split-advisory candidates (specs/comparability.md).
[project]
name = "adb-experiment-inspect-evals"
version = "0.1.0"
description = "Inspect eval tasks (inspect_evals catalog + the bundled keyless hello) as ADB experiments"
requires-python = ">=3.13"
dependencies = [
    "adb-inspect",
    # bounded so a relock is a deliberate line-edit, not silent drift of the task
    # catalog; the resolved version is recorded per run as a provenance covariate
    "inspect-evals~=0.15.0",
]

[tool.uv.sources]
adb-inspect = { path = "../../lib/adb-inspect" }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hello_task"]
