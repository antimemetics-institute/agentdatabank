[project]
name = "adb-runner"
version = "0.1.0"
description = "ADB experiment runner: validation, condition hashing, the runner protocol, storage, and provider credentials"
requires-python = ">=3.13"
dependencies = [
    "rfc8785>=0.1.4",
    # the event vocabulary lives in adb-events (one definition, shared with every
    # python experiment); the runner uses it for ingestion validation + `adb-emit`
    "adb-events",
    # the canonical provider registry (names + credential templates); the runner
    # uses it for the credential store's prompt templates and the missing-set gate
    "adb-providers",
]

# adb-events is in-repo (not yet on PyPI); the nix build resolves it from the same path
[tool.uv.sources]
adb-events = { path = "../lib/adb-events" }
adb-providers = { path = "../lib/adb-providers" }

[project.scripts]
adb-runner = "adb_runner.cli:main"
adb-emit = "adb_runner.emit:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adb_runner"]
